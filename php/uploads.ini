; Admin image uploads allow up to 4 MB per file (see the image validation
; rules). PHP's default upload_max_filesize is 2M, which made 2–4 MB images
; fail with "The image failed to upload." Load this file when serving locally:
;   PHP_INI_SCAN_DIR=":$PWD/php" php artisan serve --port=8011
upload_max_filesize = 8M
post_max_size = 12M
